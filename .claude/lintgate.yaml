# LintGate configuration — generated by scaffold_config
# Review and adjust to match your project's needs.

pipeline_critical_paths: []

# daemon/ is intentionally out of scope (separate application track)
# data/external/ is third-party Python 2 code (already in ruff exclude)
# gse/_archive/ is historical code, not part of active surface

# Scope: paths excluded from all LintGate analysis (mirrors ruff exclude)
exclude_paths:
  - "data/external"
  - "daemon"
  - "gse/_archive"
  - "scripts/_archive"
  - ".lintgate"
  - ".venv"

controlplane:
  enabled: true
  severity_weighted_coherence: true
  channels:
    behavior:
      enabled: true
      thresholds:
        approach_cycling_count: 3
        failure_amnesia_lookback: 30
  inquiry:
    theory_grounded_signals: true
    prediction_tracking: true
    theory_coherence_check: true
    living_context: true
    session_gate: true

