[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gse*"]
exclude = ["tests*", "scripts*", "data*", "daemon*", "logs*", "prompts*"]

[project]
name = "gse"
version = "2.0.0"
description = "Geometric Semantic Encoding — hyperdimensional computing framework for semantic representation"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "msgpack>=1.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.9.4",
    "marisa-trie>=1.0.0",
]

# spaCy is no longer required to run the encoder: the default GSE-native token
# engine (gse/nlp/native.py) is deterministic and arc-free (WS1, docs/ROADMAP.md).
# It is needed only for the lexicon bootstrap definition-parser
# (gse/curation/decomposition/definition_structure.py), the opt-in
# GSEEncoder(engine="spacy"), and the WS1 parity harness (scripts/ws1_parity.py).
[project.optional-dependencies]
curation = [
    "spacy>=3.7.0",
    "en-core-web-sm",
    "requests>=2.28.0",   # external_sources downloaders (nrc/concreteness/…)
]
# SymbolicSpellCheck MCP server (gse/mcp/spell_server.py). The corrector core needs no
# extra deps; only the MCP transport does.
spellcheck-mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
gse-spellcheck-mcp = "gse.mcp.spell_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "mcp>=1.0.0",        # tests import gse.mcp.spell_server; runtime consumers use the extra
    "requests>=2.28.0",  # tests import external_sources modules (previously undeclared)
]

[tool.ruff]
target-version = "py314"
line-length = 120

# The archives (archive/, gse/_archive/, scripts/_archive/) are kept in the repo for provenance but
# are not maintained code: every tool skips them (ruff here, ty below, pytest norecursedirs).
exclude = [
    "data/external",
    "archive",   # single-path patterns: any directory named archive/_archive, at any depth
    "_archive",  # (gse/, scripts/, tests/ — tests/_archive was missed when these were listed by hand)
    "daemon",
    ".lintgate",
    "tests/detective",  # Detective-generated, content-hashed, regenerated wholesale: never hand- or tool-edited
]

[tool.ruff.format]
# Format Python files only. ruff also formats Python code blocks inside Markdown, which rewrote
# authored docs and LLM prompts (prompts/) in the repo-wide format commit; those stay as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ty.src]
# Same scope as [tool.ruff] exclude: archives and vendored third-party code are not checked.
exclude = ["**/archive", "**/_archive", "data/external", "daemon"]

[tool.pytest.ini_options]
minversion = "9.0"
# -ra: summarize every non-pass outcome; strict markers/config: a typo'd marker or ini key is an
# error, not a silently ignored no-op; xfail_strict: an xfail that starts passing must be looked at.
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
log_level = "INFO"
markers = ["detective: test generated by Detective"]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Skip archived/drift tests during collection, consistent with the archive exclusions in
# [tool.ruff] and [tool.ty.src] (and the archives carry no __init__.py, so nothing archived ships).
norecursedirs = ["archive", "_archive", "*_archive"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
