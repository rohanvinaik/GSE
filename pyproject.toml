[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gse*"]
exclude = ["tests*", "scripts*", "data*", "daemon*", "logs*", "prompts*"]

[project]
name = "gse"
version = "2.0.0"
description = "Geometric Semantic Encoding — hyperdimensional computing framework for semantic representation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "msgpack>=1.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.9.4",
    "marisa-trie>=1.0.0",
]

# spaCy is no longer required to run the encoder: the default GSE-native token
# engine (gse/nlp/native.py) is deterministic and arc-free (WS1, docs/ROADMAP.md).
# It is needed only for the lexicon bootstrap definition-parser
# (gse/curation/decomposition/definition_structure.py), the opt-in
# GSEEncoder(engine="spacy"), and the WS1 parity harness (scripts/ws1_parity.py).
[project.optional-dependencies]
curation = [
    "spacy>=3.7.0",
    "en-core-web-sm",
]
# SymbolicSpellCheck MCP server (gse/mcp/spell_server.py). The corrector core needs no
# extra deps; only the MCP transport does.
spellcheck-mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
gse-spellcheck-mcp = "gse.mcp.spell_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

exclude = [
    "data/external",
    "scripts/_archive",
    "gse/_archive",
    "daemon",
    ".lintgate",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Skip archived/drift tests during collection, consistent with the _archive
# exclusions in [tool.ruff] and [tool.setuptools.packages.find].
norecursedirs = ["_archive", "*_archive"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
