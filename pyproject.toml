[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["GSE*"]
exclude = ["tests*", "scripts*", "data*", "daemon*", "logs*", "prompts*"]

[project]
name = "GSE"
version = "2.0.0"
description = "Geometric Semantic Encoding — hyperdimensional computing framework for semantic representation"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "msgpack>=1.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.10.4",
    "marisa-trie>=1.0.0",
]

# spaCy is no longer required to run the encoder: the default GSE-native token
# engine (GSE/nlp/native.py) is deterministic and arc-free (WS1, docs/ROADMAP.md).
# It is needed only for the lexicon bootstrap definition-parser
# (GSE/curation/decomposition/definition_structure.py), the opt-in
# GSEEncoder(engine="spacy"), and the WS1 parity harness (scripts/ws1_parity.py).
[project.optional-dependencies]
curation = [
    "spacy>=3.7.0",
    "en-core-web-sm",
    "requests>=2.28.0",   # external_sources downloaders (nrc/concreteness/…)
]
# SymbolicSpellCheck MCP server (GSE/mcp/spell_server.py). The corrector core needs no
# extra deps; only the MCP transport does.
spellcheck-mcp = [
    "mcp>=1.30.0",
]

[project.scripts]
GSE-spellcheck-mcp = "GSE.mcp.spell_server:main"
GSE-lexicon = "GSE.curation.cli.commands:main"  # the one lexicon builder (GSE/curation/lexicon_builder)

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "mcp>=1.30.0",        # tests import GSE.mcp.spell_server; runtime consumers use the extra
    "requests>=2.28.0",  # tests import external_sources modules (previously undeclared)
    "hypothesis>=6",  # generated producer/adoption contract tests
    "import-linter>=2.17",
]
# Detective pins behaviour by running this suite in-process under its own interpreter, so it runs from
# this venv (`.venv/bin/detective`), never from a throwaway `uv run --with detective-spec` environment:
# those change the interpreter on every run, and no two runs compare (#42). While PyPI trails the local
# checkouts, every run also carries PYTHONPATH=$HOME/tools/Detective:$HOME/tools/Wesker.
detective = [
    "detective-spec>=1.1.1",
    "ruff==0.16.10",  # Detective needs a ruff; the venv's is the gate's pinned one, never a second version
]

[tool.uv]
default-groups = ["dev", "detective"]  # a plain `uv sync` or `uv run` keeps Detective installed

[tool.ruff]
target-version = "py314"
line-length = 120

# The archives (archive/, GSE/_archive/, scripts/_archive/) are kept in the repo for provenance but
# are not maintained code: every tool skips them (ruff here, ty below, pytest norecursedirs).
exclude = [
    "data/external",
    "archive",   # single-path patterns: any directory named archive/_archive, at any depth
    "_archive",  # (GSE/, scripts/, tests/ — tests/_archive was missed when these were listed by hand)
    "daemon",
    ".lintgate",
    "tests/detective",  # Detective-generated, content-hashed, regenerated wholesale: never hand- or tool-edited
    "docs/verification",  # frozen evidence and implementation snapshots retain their original formatting
]

[tool.ruff.format]
# Format Python files only. ruff also formats Python code blocks inside Markdown, which rewrote
# authored docs and LLM prompts (prompts/) in the repo-wide format commit; those stay as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ty.src]
# Same scope as [tool.ruff] exclude: archives and vendored third-party code are not checked.
exclude = ["**/archive", "**/_archive", "data/external", "daemon"]

[tool.deptry]
# Advisory (docs/program/ASSURANCE.md): run as `uv run --with deptry deptry .`. Same scope as ruff and
# ty, so archives, dated records and data are not reported; what remains are real findings.
extend_exclude = [".*_archive/", "archive/", "docs/", "daemon/", "data/"]
known_first_party = ["GSE"]

[tool.deptry.per_rule_ignores]
DEP002 = ["en-core-web-sm"]  # a spaCy model loaded by name, never imported

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["."]
# -ra: summarize every non-pass outcome; strict markers/config: a typo'd marker or ini key is an
# error, not a silently ignored no-op; xfail_strict: an xfail that starts passing must be looked at.
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
log_level = "INFO"
markers = ["detective: test generated by Detective"]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Skip archived/drift tests during collection, consistent with the archive exclusions in
# [tool.ruff] and [tool.ty.src] (and the archives carry no __init__.py, so nothing archived ships).
norecursedirs = ["archive", "_archive", "*_archive"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

# Import direction, checked by `lint-imports` in scripts/ci_local.sh. A forbidden direction is a
# rule; a line under ignore_imports is a recorded exception, named with the task in
# openspec/changes/organize-package-by-subsystem/tasks.md that removes it. Exceptions only ever
# shrink: a new violation fails the gate.
[tool.importlinter]
root_package = "GSE"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "runtime-not-build"
name = "The runtime never imports lexicon construction"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "GSE.api",
    "GSE.symbolic",
    "GSE.nlp",
    "GSE.discourse",
    "GSE.cassettes",
    "GSE.lexical_evidence",
    "GSE.lexicon_resource",
    "GSE.lexicon",
    "GSE.frequency",
    "GSE.structure",
    "GSE.scales",
    "GSE.vectors_v2",
    "GSE.primitives_v2",
    "GSE.prime_projection",
    "GSE.scale_definition",
    "GSE.namespace",
    "GSE.encoders",
    "GSE.pragmatics",
    "GSE.mcp",
    "GSE.cli",
    "GSE.verification",
    "GSE.curation.schema",
    "GSE.curation.personal_dictionary",
    "GSE.curation.frequency_integration",
]
forbidden_modules = [
    "GSE.curation.lexicon_builder",
    "GSE.curation.external_sources",
    "GSE.curation.lexicon_db",
    "GSE.curation.cli",
]
ignore_imports = [
    # Task 4.1: the definition reader and the closed-class catalog move into the runtime lexicon.
    "GSE.api.encoder -> GSE.curation.external_sources.gse_closed_class",
    "GSE.symbolic.lexical_grounding -> GSE.curation.lexicon_builder.foundation",
    "GSE.symbolic.lexical_grounding -> GSE.curation.lexicon_builder.catalog",
    "GSE.symbolic.lexical_grounding -> GSE.curation.external_sources.gse_closed_class",
    # Task 1.5 (owner decision): the flat-lexicon builder behind data/lexicon_clean.db.
    "GSE.curation.frequency_integration -> GSE.curation.lexicon_db",
]

[[tool.importlinter.contracts]]
id = "runtime-not-experiments"
name = "The runtime never imports the unfinished experiments"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "GSE.api",
    "GSE.symbolic",
    "GSE.nlp",
    "GSE.discourse",
    "GSE.cassettes",
    "GSE.lexical_evidence",
    "GSE.lexicon_resource",
    "GSE.lexicon",
    "GSE.frequency",
    "GSE.structure",
    "GSE.scales",
    "GSE.vectors_v2",
    "GSE.primitives_v2",
    "GSE.encoders",
    "GSE.pragmatics",
    "GSE.mcp",
    "GSE.cli",
]
forbidden_modules = [
    "GSE.pipeline_v2",
    "GSE.merkle",
    "GSE.patterns",
    "GSE.teaching",
    "GSE.profiles",
    "GSE.cache",
    "GSE.orchestration",
    "GSE.parsing",
    "GSE.composition",
    "GSE.evaluation",
    "GSE.benchmarks",
    "GSE.verb_templates",
    "GSE.curation.llm",
]

[[tool.importlinter.contracts]]
id = "trace-types-standalone"
name = "The trace types never import the encoder or the symbolic layer"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["GSE.api.trace", "GSE.api.errors"]
forbidden_modules = ["GSE.api.encoder", "GSE.api.decoder", "GSE.symbolic"]

[[tool.importlinter.contracts]]
id = "symbolic-not-bridge"
name = "The symbolic layer never imports the Genesis/Regenesis bridge"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "GSE.symbolic.claims",
    "GSE.symbolic.coherence",
    "GSE.symbolic.duration",
    "GSE.symbolic.expression",
    "GSE.symbolic.genealogy_store",
    "GSE.symbolic.grounding",
    "GSE.symbolic.inference",
    "GSE.symbolic.lexical_grounding",
    "GSE.symbolic.modality",
    "GSE.symbolic.operators",
    "GSE.symbolic.predicates",
    "GSE.symbolic.propositions",
    "GSE.symbolic.queries",
    "GSE.symbolic.resolution",
    "GSE.symbolic.sense_resonance",
    "GSE.symbolic.serialization",
    "GSE.symbolic.signs",
    "GSE.symbolic.templating",
    "GSE.symbolic.tiers",
]
forbidden_modules = ["GSE.symbolic.emit", "GSE.symbolic.variables", "GSE.symbolic.healer", "GSE.symbolic.narrative"]
ignore_imports = [
    # Task 5.4: emit_contract_with_coherence and its variable form are bridge functions that live in
    # coherence; they move to the bridge with the interface, since Genesis imports them today.
    "GSE.symbolic.coherence -> GSE.symbolic.emit",
    "GSE.symbolic.coherence -> GSE.symbolic.variables",
]

[[tool.importlinter.contracts]]
id = "core-not-apps"
name = "The core never imports the applications"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "GSE.api",
    "GSE.symbolic",
    "GSE.nlp",
    "GSE.cassettes",
    "GSE.discourse.speech",
    "GSE.discourse.intake",
    "GSE.discourse.profile",
    "GSE.lexical_evidence",
    "GSE.lexicon",
    "GSE.structure",
]
forbidden_modules = [
    "GSE.discourse.registers",
    "GSE.discourse.router",
    "GSE.discourse.nested_router",
    "GSE.discourse.infer",
    "GSE.encoders",
    "GSE.pragmatics",
    "GSE.demo",
]
