# CI runs exactly the local gate (scripts/ci_local.sh) on a clean Linux runner.
# Measured on a fresh clone with no NLTK data: the only external resource the suite needs is the
# WordNet corpus (the native engine reads it at runtime); tests that need locally built data
# (data/genealogy.db, the spell-entity and HDC-speller caches, the Wiktionary wordlist,
# data/frequency.db) skip when it is absent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (scripts/ci_local.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Python and the locked environment
        run: |
          uv python install
          uv sync --locked

      - name: WordNet corpus
        run: uv run python -c "import nltk; assert nltk.download('wordnet', quiet=True)"

      - name: Gate
        run: scripts/ci_local.sh
